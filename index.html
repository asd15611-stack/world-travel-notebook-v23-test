.daily-bars{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:12px 1px 5px;min-height:145px}.daily-bar{flex:1;min-width:49px;max-width:105px;text-align:center;font-size:11px}.daily-bar .bar-area{height:95px;display:flex;align-items:flex-end;justify-content:center}.daily-bar .bar-fill{width:60%;min-height:3px;border-radius:7px 7px 0 0;background:#298d82}.daily-bar b{display:block;font-size:11px;overflow-wrap:anywhere}.member-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.member-checks label{background:#eff6f2;border:1px solid #d0e3da;border-radius:10px;padding:8px;display:flex;gap:7px;align-items:center;overflow-wrap:anywhere}.member-checks input{accent-color:var(--teal)}.split-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ecf0ed;padding:8px 0}.split-row:last-child{border-bottom:0}

.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dashboard-box{border:1px solid var(--line);border-radius:15px;background:var(--white);padding:14px;min-width:0}.dashboard-box h3{font-size:15px;margin:0 0 7px}.dashboard-box .small{overflow-wrap:anywhere}.dashboard-wide{grid-column:1/-1}.dashboard-line{padding:9px 0;border-top:1px solid var(--line)}.dashboard-line:first-of-type{border-top:0}.dashboard-meter{height:11px;background:#e3e9e5;border-radius:30px;overflow:hidden;margin:9px 0}.dashboard-meter>span{display:block;height:100%;background:var(--teal);border-radius:30px}.dashboard-alert{color:var(--red);font-weight:700}.dashboard-box .textbtn{padding:4px 0}.dashboard-heading{font-weight:700;font-size:14px}.dashboard-box .sub{overflow-wrap:anywhere}@media(max-width:359px){.dashboard-grid{grid-template-columns:1fr}.dashboard-wide{grid-column:auto}}

<body>
<div id="app" class="wrap"></div><nav id="nav" class="nav" aria-label="主要選單"></nav><div id="modal" class="modal" role="dialog" aria-modal="true"><div id="dialog" class="dialog"></div></div><div id="toast" role="status" class="toast"></div><input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';
// 全新的資料命名空間；不讀取、變更任何其他網站或舊旅行專案的儲存鍵。
const STORE='world-travel-notebook-fresh-v1';
const TYPES=['plans','expenses','notes','tasks'];
// UI 顯示中英雙語；儲存值維持既有中文分類，確保舊資料相容。
const EXPENSE_CATEGORIES={'餐飲':'Food & Drinks','交通':'Transportation','住宿':'Accommodation','門票':'Tickets & Admission','購物':'Shopping','其他':'Other'};
const expenseCategoryLabel=value=>{const key=String(value||'其他');return key+(EXPENSE_CATEGORIES[key]?' · '+EXPENSE_CATEGORIES[key]:'')};
// 幣別代碼維持原值，只變更顯示文字，不影響既有旅行與備份。
const CURRENCY_NAMES={TWD:'新台幣 · New Taiwan Dollar',JPY:'日圓 · Japanese Yen',KRW:'韓元 · South Korean Won',VND:'越南盾 · Vietnamese Dong',USD:'美元 · US Dollar',EUR:'歐元 · Euro',CNY:'人民幣 · Chinese Yuan',THB:'泰銖 · Thai Baht',HKD:'港幣 · Hong Kong Dollar',SGD:'新加坡幣 · Singapore Dollar',GBP:'英鎊 · British Pound',AUD:'澳幣 · Australian Dollar',OTHER:'其他幣別 · Other Currency'};
const currencyLabel=code=>CURRENCY_NAMES[code]?CURRENCY_NAMES[code]+' ('+code+')':String(code||'');
const MAX_IMPORT_BYTES=15*1024*1024;
const cents=n=>Math.round(Number(n)*100);
const formatCents=n=>money(n/100);
const uniqueMembers=txt=>[...new Set(String(txt||'').split(/[，、,\n]/).map(x=>x.trim()).filter(Boolean))];
const membersFor=t=>Array.isArray(t.members)?t.members:[];
function splitAmounts(total,participants){const base=Math.floor(cents(total)/participants.length),extra=cents(total)%participants.length;return participants.map((name,i)=>({name,cents:base+(i<extra?1:0)}))}
function balances(t){const out={};for(const x of t.expenses){if(!x.split||!Array.isArray(x.split.people)||!x.split.people.length||!x.payer)continue;const shares=splitAmounts(x.amount,x.split.people);out[x.payer]=(out[x.payer]||0)+cents(x.amount);for(const y of shares)out[y.name]=(out[y.name]||0)-y.cents}return out}
function settlements(t){const b=balances(t),debt=[],credit=[];for(const [name,v] of Object.entries(b)){if(v<0)debt.push({name,amount:-v});if(v>0)credit.push({name,amount:v})}debt.sort((a,b)=>a.name.localeCompare(b.name));credit.sort((a,b)=>a.name.localeCompare(b.name));const items=[];let i=0,j=0;while(i<debt.length&&j<credit.length){const v=Math.min(debt[i].amount,credit[j].amount);if(v>0)items.push({from:debt[i].name,to:credit[j].name,cents:v});debt[i].amount-=v;credit[j].amount-=v;if(debt[i].amount===0)i++;if(credit[j].amount===0)j++}return items}

const $=s=>document.querySelector(s);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const uid=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));
const today=()=>{let d=new Date(),z=d.getTimezoneOffset();return new Date(d.getTime()-z*60000).toISOString().slice(0,10)};
const blank=()=>({version:1,active:null,trips:[]});
let state;let tab='home';let modalMode='';
function validItem(x,type){if(!x||typeof x!=='object'||Array.isArray(x)||typeof x.id!=='string'||typeof x.title!=='string'||typeof x.date!=='string'||typeof x.detail!=='string')return false;if(type==='expenses'&&(!Number.isFinite(x.amount)||x.amount<0||x.amount>1e12))return false;if(type==='expenses'&&x.split!==undefined&&(typeof x.split!=='object'||x.split===null||!Array.isArray(x.split.people)||x.split.people.length<1||x.split.people.length>30||x.split.people.some(p=>typeof p!=='string'||!p.trim()||p.length>80)||new Set(x.split.people).size!==x.split.people.length||typeof x.payer!=='string'||!x.payer.trim()))return false;if(type==='tasks'&&typeof x.done!=='boolean')return false;if(type==='notes'&&x.photo!==undefined&&(typeof x.photo!=='string'||x.photo.length>400000||!!x.photo&&!/^data:image\/(jpeg|webp|png);base64,[a-zA-Z0-9+/=]+$/.test(x.photo)))return false;if(type==='plans'&&x.url!==undefined&&(typeof x.url!=='string'||!!x.url&&!/^https:\/\/[^\s]+$/i.test(x.url)))return false;if(type==='plans'){for(const [field,max] of [['provider',160],['bookingStatus',40],['startAt',24],['endAt',24],['contact',160]])if(x[field]!==undefined&&(typeof x[field]!=='string'||x[field].length>max))return false;if(x.bookingStatus&&!['待預訂','已預訂','已付款','部分付款','已取消'].includes(x.bookingStatus))return false;if(x.startAt&&x.endAt&&x.endAt<x.startAt)return false}return true}
// V1.8 文件附檔與預訂紀錄：檔案一律保存在每趟旅程，隨 JSON 備份一起匯出。
const DOCUMENT_TYPES=['機票 Flight','住宿 Hotel','交通 Transport','活動 Activity','保險 Insurance','其他 Other'];
const FILE_MIMES={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
const MAX_DOC_FILE=450000; // 每個附件位元組上限；本機 localStorage 並非安全文件庫
function validDocument(x){return x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.id==='string'&&x.id.length<=100&&typeof x.title==='string'&&x.title.length<=160&&typeof x.kind==='string'&&DOCUMENT_TYPES.includes(x.kind)&&typeof x.date==='string'&&x.date.length<=20&&typeof x.ref==='string'&&x.ref.length<=160&&typeof x.note==='string'&&x.note.length<=3000&&typeof x.filename==='string'&&x.filename.length<=160&&typeof x.filedata==='string'&&x.filedata.length<=610000&&(!x.filedata||/^data:(application\/pdf|image\/(jpeg|png|webp));base64,[a-zA-Z0-9+/=]+$/.test(x.filedata))}
function docsFor(t){return t?.documents||[]}
function docList(){const t=trip();let h=shell('旅行文件與憑證','預訂編號、電子票券及離線附件');if(!t)return h+'<div class="empty">請先建立旅行</div>';h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-action="addDocument">＋ 新增文件</button></div><div class="safewarn">安全提醒：文件會儲存在此瀏覽器，並包含在 JSON 備份中，<b>沒有加密</b>。不要上傳護照個資頁、簽證或含敏感身分資訊的檔案；建議只存訂房憑證、已遮蔽個資的票券。請保管好備份檔。</div><p class="hint">附件支援 PDF、JPG、PNG、WebP，單檔小於 450 KB；容量不足時不會覆寫既有資料。離線開啟取決於瀏覽器是否仍保存本站資料。</p>`;const docs=docsFor(t);if(!docs.length)return h+'<div class="empty">尚無旅行文件<br>可以先新增訂房或交通預訂資訊。</div>';h+=`<div class="row between"><b>已收藏 ${docs.length} 份文件</b><span class="pill">獨立於其他旅程</span></div>`;for(const d of [...docs].sort((a,b)=>a.date.localeCompare(b.date)))h+=`<article class="card"><span class="tag">${safe(d.kind)}</span><h3 style="margin-top:9px">${safe(d.title)}</h3>${d.date?`<div class="small">日期：${safe(d.date)}</div>`:''}${d.ref?`<div class="small">預訂編號：${safe(d.ref)}</div>`:''}${d.note?`<p class="note-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${safe(d.note)}</p>`:''}${d.filedata?`<div class="small">📎 ${safe(d.filename)}（可下載）</div>`:''}<div class="actions"><button class="secondary" data-docedit="${safe(d.id)}">編輯</button>${d.filedata?`<button class="secondary" data-docdownload="${safe(d.id)}">下載附件</button>`:''}<button class="danger" data-docdelete="${safe(d.id)}">刪除</button></div></article>`;return h}
function documentForm(id){const t=trip();if(!t)return;const d=docsFor(t).find(x=>x.id===id);openModal(`<form id="documentForm" data-id="${safe(d?.id||'')}"><h2>${d?'編輯':'新增'}旅行文件</h2><div class="field"><label>文件名稱 *</label><input name="title" required maxlength="160" value="${safe(d?.title||'')}" placeholder="例如：飯店訂房確認"></div><div class="field-row"><div class="field"><label>類別 Category</label><select name="kind">${DOCUMENT_TYPES.map(k=>`<option ${d?.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>日期</label><input name="date" type="date" value="${safe(d?.date||'')}"></div></div><div class="field"><label>預訂編號</label><input name="ref" maxlength="160" value="${safe(d?.ref||'')}"></div><div class="field"><label>備註</label><textarea name="note" maxlength="3000">${safe(d?.note||'')}</textarea></div><div class="field"><label>附件（選填，小於 450 KB）</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"><div class="hint">${d?.filename?'現有附件：'+safe(d.filename)+'。不選新檔就會保留。':'可不附檔，只儲存預訂資訊。'}</div></div>${d?.filedata?'<label class="check"><input type="checkbox" name="removeFile">移除原有附件</label>':''}<div class="actions"><button type="submit" class="primary">儲存文件</button><button type="button" class="secondary" data-action="close">取消</button></div></form>`)}
function readDocFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('讀取失敗'));r.readAsDataURL(file)})}
async function saveDocument(f){const t=trip();if(!t)return;const v=new FormData(f),name=String(v.get('title')||'').trim(),kind=String(v.get('kind')||''),date=String(v.get('date')||''),ref=String(v.get('ref')||'').trim(),note=String(v.get('note')||'');if(!name||!DOCUMENT_TYPES.includes(kind)){notify('請輸入有效文件名稱與分類');return}const n=copy(),dest=n.trips.find(x=>x.id===n.active),list=dest.documents||(dest.documents=[]),old=list.find(x=>x.id===f.dataset.id);if(!old&&list.length>=80){notify('單趟旅行最多 80 份文件');return}const d={id:old?.id||uid(),title:name,kind,date,ref,note,filename:old?.filename||'',filedata:old?.filedata||''};if(v.get('removeFile')){d.filename='';d.filedata=''}const file=f.querySelector('input[type=file]').files[0];if(file){if(!FILE_MIMES[file.type]||file.size>=MAX_DOC_FILE){notify('只支援 PDF / JPG / PNG / WebP，單檔必須小於 450 KB');return}try{d.filedata=await readDocFile(file);d.filename=file.name.slice(0,160)}catch(e){notify('附件讀取失敗');return}}if(!validDocument(d)){notify('文件資料格式不正確');return}if(old)Object.assign(old,d);else list.push(d);if(persist(n)){closeModal();render();notify('旅行文件已儲存')}}
function deleteDocument(id){const t=trip(),d=docsFor(t).find(x=>x.id===id);if(!d||!confirm('確定永久刪除「'+d.title+'」與其附件？'))return;const n=copy(),target=n.trips.find(x=>x.id===n.active);target.documents=docsFor(target).filter(x=>x.id!==id);if(persist(n)){render();notify('文件已刪除')}}
function downloadDocument(id){const d=docsFor(trip()).find(x=>x.id===id);if(!d?.filedata||!validDocument(d))return;const match=/^data:([^;]+);base64,(.+)$/.exec(d.filedata);if(!match)return;try{const bytes=Uint8Array.from(atob(match[2]),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:match[1]}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=d.filename||'旅行附件';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){notify('附件無法下載')}}
function validTrip(t){return t&&typeof t==='object'&&!Array.isArray(t)&&['id','name','country','start','end','currency'].every(k=>typeof t[k]==='string')&&TYPES.every(k=>Array.isArray(t[k])&&t[k].length<=5000&&t[k].every(x=>validItem(x,k)))&&t.name.length<=160&&(t.budget===undefined||(typeof t.budget==='number'&&Number.isFinite(t.budget)&&t.budget>=0&&t.budget<=1e12))&&(t.members===undefined||(Array.isArray(t.members)&&t.members.length<=30&&t.members.every(m=>typeof m==='string'&&m.trim()&&m.length<=80)&&new Set(t.members).size===t.members.length))&&(t.documents===undefined||(Array.isArray(t.documents)&&t.documents.length<=80&&t.documents.every(validDocument)))}
function validData(x){return x&&typeof x==='object'&&x.version===1&&Array.isArray(x.trips)&&x.trips.length<=300&&x.trips.every(validTrip)}
function load(){try{const raw=localStorage.getItem(STORE);if(!raw)return blank();const parsed=JSON.parse(raw);if(!validData(parsed))throw Error('格式不正確');return parsed}catch(e){alert('無法讀取旅行資料。為避免覆蓋原有內容，已進入唯讀保護模式。請先檢查瀏覽器儲存空間。');readOnly=true;return blank()}}
let readOnly=false;state=load();
function persist(next){if(readOnly){notify('目前為資料保護模式，無法修改');return false}if(!validData(next)){notify('儲存取消：資料驗證未通過，原有資料保持不變');return false}try{const serialized=JSON.stringify(next);localStorage.setItem(STORE,serialized);state=next;return true}catch(e){notify('儲存失敗：裝置空間不足或瀏覽器禁止儲存；原畫面資料未更動');return false}}
let expenseFilter='all';
const trip=()=>state.trips.find(x=>x.id===state.active)||null;
const copy=()=>JSON.parse(JSON.stringify(state));
function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),3500)}
function go(t){tab=t;if(t==='expenses')expenseFilter='all';render();window.scrollTo(0,0)}
const dates=t=>[t.start,t.end].filter(Boolean).join(' ～ ')||'未設定日期';
function navRender(){const menus=[['home','⌂','首頁'],['plans','▤','行程'],['expenses','＄','記帳'],['notes','▧','紀錄'],['more','☷','更多']];$('#nav').innerHTML=menus.map(([id,ico,name])=>`<button data-go="${id}" ${tab===id?'aria-current="page"':''}><span aria-hidden="true">${ico}</span>${name}</button>`).join('')}
function shell(title,subtitle=''){return `<div class="mast"><div><div class="brand">WORLD TRAVEL NOTEBOOK</div><h1 class="title">${safe(title)}</h1><div class="sub">${safe(subtitle)}</div></div><button class="secondary" data-action="switch">${trip()?'切換旅程':'旅行庫'} ⌄</button></div>`}
function render(){navRender();const a=$('#app');if(tab==='home')a.innerHTML=home();else if(tab==='more')a.innerHTML=more();else if(tab==='plans')a.innerHTML=plansView();else if(tab==='expenses')a.innerHTML=expensesView();else if(tab==='notes')a.innerHTML=memoriesView();else if(tab==='documents')a.innerHTML=docList();else if(tab==='checklist')a.innerHTML=checklistView();else if(tab==='offline')a.innerHTML=offlineView();else a.innerHTML=entries(tab)}

function dashboard(t){
 const now=today(),todayPlans=t.plans.filter(x=>x.date===now).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const futurePlans=t.plans.filter(x=>x.date>=now).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
 const booking=t.plans.filter(x=>x.bookingStatus&&x.bookingStatus!=='已取消'&&(x.startAt?.slice(0,10)||x.date)>=now).sort((a,b)=>(a.startAt||a.date).localeCompare(b.startAt||b.date))[0];
 const pending=t.tasks.filter(x=>!x.done).slice(0,3);
 const spent=Math.round(t.expenses.reduce((s,x)=>s+Number(x.amount||0),0)*100)/100;
 const budget=Number(t.budget)||0;
 const pct=budget>0?Math.round(spent/budget*100):0;
 const phase=t.start&&now<t.start?'距離出發還有 '+Math.ceil((Date.parse(t.start+'T12:00:00')-Date.parse(now+'T12:00:00'))/86400000)+' 天':t.end&&now>t.end?'旅程已結束':t.start&&t.end?'旅途中 · '+(Math.round((Date.parse(now+'T12:00:00')-Date.parse(t.start+'T12:00:00'))/86400000)+1)+' / '+(Math.round((Date.parse(t.end+'T12:00:00')-Date.parse(t.start+'T12:00:00'))/86400000)+1)+' 天':'自由旅程';
 const schedule=todayPlans.length?todayPlans:futurePlans.slice(0,2);
 let h=`<div class="section"><h2>今日旅程儀表板</h2><span class="section-sub">${safe(now)} · ${safe(phase)}</span></div><div class="dashboard-grid">`;
 h+=`<section class="dashboard-box dashboard-wide"><h3>🗓 ${todayPlans.length?'今天的安排':'接下來的安排'} · Today's itinerary</h3>${schedule.length?schedule.slice(0,4).map(x=>`<div class="dashboard-line"><div class="dashboard-heading">${safe(x.date)} ${safe(x.time||x.startAt?.slice(11,16)||'')}　${safe(x.title)}</div><div class="sub">${safe(x.place||x.provider||x.detail||'')}</div></div>`).join(''):'<div class="sub">目前沒有今天或未來的行程。</div>'}<button class="textbtn" data-go="plans">查看所有行程 →</button></section>`;
 h+=`<section class="dashboard-box"><h3>💳 旅費預算 · Budget</h3><div class="small">已花費：${money(spent)} / ${safe(currencyLabel(t.currency))}</div>${budget>0?`<div class="dashboard-meter" role="progressbar" aria-valuenow="${Math.min(100,Math.max(0,pct))}" aria-valuemin="0" aria-valuemax="100" aria-label="預算使用比例"><span style="width:${Math.min(100,Math.max(0,pct))}%"></span></div><div class="small ${spent>budget?'dashboard-alert':''}">${spent>budget?'超支 '+money(spent-budget):'剩餘 '+money(budget-spent)} · 已使用 ${pct}%</div>`:'<div class="sub">尚未設定預算</div>'}<button class="textbtn" data-go="expenses">查看記帳 →</button></section>`;
 h+=`<section class="dashboard-box"><h3>☑ 待辦提醒 · Tasks</h3>${pending.length?pending.map(x=>`<div class="dashboard-line small">□ ${safe(x.title)}</div>`).join(''):'<div class="sub">目前沒有未完成的待辦</div>'}<button class="textbtn" data-go="more">查看待辦 →</button></section>`;
 h+=`<section class="dashboard-box dashboard-wide"><h3>🎫 最近的預訂 · Next booking</h3>${booking?`<div class="dashboard-heading">${safe(booking.title)}</div><div class="sub">${safe((booking.startAt||booking.date).replace('T',' '))} · ${safe(booking.bookingStatus)} ${booking.provider?'· '+safe(booking.provider):''}</div>${booking.ref?`<div class="small">預訂編號：${safe(booking.ref)}</div>`:''}`:'<div class="sub">沒有即將到來的預訂紀錄</div>'}<button class="textbtn" data-go="plans">查看預訂詳情 →</button></section></div>`;
 return h;
}
function home(){const t=trip();let h=shell('世界旅記','每次出發，都是新的故事');if(!t)return h+`<section class="hero"><div class="heading" style="color:#d7f3e9">YOUR NEXT ADVENTURE</div><h2>把世界，寫進自己的故事。</h2><p class="sub">行程、花費、風景與回憶，都收藏在這裡。</p><button data-action="newTrip">＋ 建立第一趟旅行</button></section><div class="section"><h2>旅行收藏</h2></div><div class="empty">🌍<h3>從你的第一趟旅程開始</h3><p class="sub">完全空白，沒有任何預載旅行資料。</p></div>`;const spent=t.expenses.reduce((s,x)=>s+x.amount,0),done=t.tasks.filter(x=>x.done).length,days=t.start&&t.end?Math.round((Date.parse(t.end)-Date.parse(t.start))/86400000)+1:0;const upcoming=[...t.plans].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))[0];h+=`<section class="hero"><div class="heading" style="color:#d7f3e9">CURRENT JOURNEY</div><h2>${safe(t.name)}</h2><p class="sub">📍 ${safe(t.country||'自由探索')} · ${safe(dates(t))}</p><div class="hero-metrics"><span>🗓 ${days>0?days+' 天':'自由日期'}</span><span>🧳 ${t.plans.length} 個行程</span><span>✅ ${done}/${t.tasks.length} 待辦</span></div></section><div class="section"><h2>旅程概覽</h2><span class="section-sub">資料僅存於本裝置</span></div><div class="overview"><div class="stat"><div class="small">行程安排</div><b>${t.plans.length} 個</b></div><div class="stat"><div class="small">總花費 · ${safe(currencyLabel(t.currency))}</div><b>${money(spent)}</b></div><div class="stat"><div class="small">回憶記錄</div><b>${t.notes.length} 篇</b></div><div class="stat"><div class="small">完成準備</div><b>${done}/${t.tasks.length}</b></div></div>${dashboard(t)}<div class="section"><h2>快速開始</h2></div><div class="quick"><button data-go="plans"><span>🗓</span>安排路線</button><button data-go="expenses"><span>💰</span>記一筆花費</button><button data-go="notes"><span>📷</span>收藏回憶</button></div><div class="section"><h2>下一個安排</h2></div>${upcoming?`<div class="card"><span class="tag">${safe(upcoming.date)} ${safe(upcoming.time||'')}</span><h3 style="margin-top:8px">${safe(upcoming.title)}</h3><div class="sub">${safe(upcoming.place||upcoming.detail||'')}</div><button class="textbtn" data-go="plans">查看行程 →</button></div>`:`<div class="empty"><div class="emoji">🗓</div>尚未安排接下來的行程<br><button class="secondary" data-go="plans">開始規劃</button></div>`}<div class="section"><h2>我的旅行收藏</h2><button class="textbtn" data-action="switch">全部旅程</button></div>${state.trips.slice(0,5).map(tripCard).join('')}`;return h}
function tripCard(t){return `<div class="card trip-card"><div class="flag" aria-hidden="true">🌐</div><div class="grow"><h3>${safe(t.name)}</h3><div class="small">${safe(t.country||'自由目的地')} · ${safe(dates(t))}</div></div>${t.id===state.active?'<span class="pill">目前</span>':`<button class="secondary" data-activate="${safe(t.id)}">開啟</button>`}</div>`}
const labels={plans:['行程','出發前，把每個期待安排妥當','行程','📍'],expenses:['記帳','每一筆花費都記得','支出','💳'],notes:['旅行紀錄','把沿途的照片、心情和故事收進回憶','回憶','✍️'],tasks:['清單','重要準備，逐一打勾','待辦','✓']};
function entries(type){const t=trip(),[title,sub,item,emoji]=labels[type];let h=shell(title,sub);if(!t)return h+`<div class="empty"><div class="emoji">🧳</div><h3>先建立一趟旅行</h3><p class="sub">每趟旅行的紀錄都會獨立保存。</p><button class="primary" data-action="newTrip">建立旅程</button></div>`;h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-add="${type}">＋ 新增${item}</button></div>`;const list=[...t[type]].sort((a,b)=>b.date.localeCompare(a.date));if(!list.length)return h+`<div class="empty"><div class="emoji">${emoji}</div><h3>還沒有${item}</h3><p class="sub">點右上角新增，就能開始記錄。</p></div>`;if(type==='expenses')h+=`<div class="stat">旅程累計（${safe(currencyLabel(t.currency))}）<b>${money(t.expenses.reduce((s,x)=>s+x.amount,0))}</b></div>`;h+=list.map(x=>`<article class="card entry"><div class="row between"><span class="small">${safe(x.date||'未設定日期')}</span>${type==='tasks'?`<span class="pill">${x.done?'已完成':'待處理'}</span>`:''}</div>${type==='tasks'?`<div class="check"><input type="checkbox" aria-label="完成 ${safe(x.title)}" data-check="${safe(x.id)}" ${x.done?'checked':''}><label class="${x.done?'strike':''}" data-check-label="${safe(x.id)}"><b>${safe(x.title)}</b></label></div>`:`<h3>${safe(x.title)}</h3>`}${type==='expenses'?`<b class="accent">${safe(currencyLabel(t.currency))} ${money(x.amount)}</b>`:''}${x.detail?`<p>${safe(x.detail)}</p>`:''}<div class="actions"><button class="textbtn" data-edit="${type}:${safe(x.id)}">編輯</button><button class="textbtn" data-delete="${type}:${safe(x.id)}" style="color:var(--red)">刪除</button></div></article>`).join('');return h}
// V1.9：清單範本僅在使用者按下新增後寫入當前旅行，不修改其他旅程。
const TASK_TEMPLATES={
 '基本準備':['確認護照／身分證有效期限','確認機票與交通預訂','確認住宿預訂','準備旅遊保險','準備旅行付款方式及現金','準備手機網路或 SIM 卡','下載離線地圖','準備充電器與轉接頭'],
 '出發前':['確認簽證與入境規定（如適用）','確認航班與登機時間','整理行李與隨身物品','保存重要預訂資訊','匯出世界旅記 JSON 備份','通知旅伴集合時間'],
 '回程前':['確認回程班機與機場交通','確認退房與行李領取安排','檢查護照與貴重物品','備份旅途照片及日記']
};
function addTaskTemplate(group){const t=trip(),template=TASK_TEMPLATES[group];if(!t||!template)return;const n=copy(),dest=n.trips.find(x=>x.id===n.active);const have=new Set(dest.tasks.map(x=>x.title.trim()));const missing=template.filter(x=>!have.has(x));if(!missing.length){notify('範本項目已存在，沒有重複新增');return}if(dest.tasks.length+missing.length>5000){notify('待辦項目超出上限，未修改資料');return}if(!confirm(`將「${group}」的 ${missing.length} 個新項目加入目前旅程？現有待辦不會被變更。`))return;for(const title of missing)dest.tasks.push({id:uid(),title,date:'',detail:'',done:false});if(persist(n)){render();notify('已新增 '+missing.length+' 項待辦')}}
function checklistView(){const t=trip();let h=shell('行前檢查','自訂待辦與旅行範本');if(!t)return h+'<div class="empty">請先建立一趟旅行</div>';const done=t.tasks.filter(x=>x.done).length;h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-add="tasks">＋ 自訂待辦</button></div><div class="card"><b>完成進度 ${done}/${t.tasks.length}</b><div class="dashboard-meter"><span style="width:${t.tasks.length?Math.round(done/t.tasks.length*100):0}%"></span></div><p class="hint">範本只會增加尚未存在的項目；已完成的待辦不會被重設。</p><div class="actions">${Object.keys(TASK_TEMPLATES).map(group=>`<button class="secondary" data-template="${safe(group)}">＋ ${safe(group)}</button>`).join('')}</div></div>`;const list=[...t.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.title.localeCompare(b.title,'zh-Hant'));if(!list.length)return h+'<div class="empty">還沒有待辦。可以使用上方範本或自行新增。</div>';for(const x of list)h+=`<article class="card"><div class="check"><input type="checkbox" data-check="${safe(x.id)}" aria-label="完成 ${safe(x.title)}" ${x.done?'checked':''}><label class="${x.done?'strike':''}">${safe(x.title)}</label></div>${x.detail?`<div class="sub">${safe(x.detail)}</div>`:''}<div class="actions"><button class="secondary" data-edit="tasks:${safe(x.id)}">編輯</button><button class="danger" data-delete="tasks:${safe(x.id)}">刪除</button></div></article>`;return h}
function offlineView(){const t=trip();let h=shell('離線旅行資訊','已儲存的行程、預訂與旅行文件');const online=navigator.onLine;const pwaStatus=location.protocol==='file:'?'本機 HTML 模式（無 PWA 快取）':navigator.serviceWorker?.controller?'此分頁受離線快取控制（仍須測試離線重開）':'尚未確認離線快取控制；首次安裝後請重新開啟';h+=`<div class="card"><div class="small">APP 快取狀態：${pwaStatus}</div><b>目前連線狀態：${online?'裝置回報有網路':'裝置回報離線'}</b><p class="hint">連線狀態只供參考，不能保證外部網站可連。本版本部署於 HTTPS 網站或 localhost 時可註冊 Service Worker，首次連網載入後才能快取介面。直接雙擊 HTML 並無 PWA 安裝功能。外部地圖與網站不會離線快取，也請勿清除本站資料。</p></div>`;if(!t)return h+'<div class="empty">請先建立旅程</div>';const reservations=t.plans.filter(x=>['住宿','交通','活動'].includes(x.kind)&&x.bookingStatus!=='已取消');const docs=docsFor(t);h+=`<div class="overview"><div class="stat"><div class="small">已存行程</div><b>${t.plans.length} 筆</b></div><div class="stat"><div class="small">有效預訂</div><b>${reservations.length} 筆</b></div><div class="stat"><div class="small">旅行文件</div><b>${docs.length} 份</b></div><div class="stat"><div class="small">未完成待辦</div><b>${t.tasks.filter(x=>!x.done).length} 項</b></div></div><div class="section"><h2>住宿與交通速查</h2><button class="secondary" data-go="plans">查看行程</button></div>`;if(!reservations.length)h+='<div class="empty">尚無已儲存的交通、住宿或活動預訂。</div>';for(const x of [...reservations].sort((a,b)=>(a.startAt||a.date).localeCompare(b.startAt||b.date)))h+=`<article class="card"><span class="tag">${safe(x.kind)} · ${safe(x.bookingStatus||'未設定狀態')}</span><h3>${safe(x.title)}</h3><div class="small">${safe(x.startAt||[x.date,x.time].filter(Boolean).join(' '))}</div>${x.place?`<div>${safe(x.place)}</div>`:''}${x.provider?`<div class="small">業者：${safe(x.provider)}</div>`:''}${x.ref?`<div class="small">預訂編號：${safe(x.ref)}</div>`:''}${x.contact?`<div class="small">聯絡資訊：${safe(x.contact)}</div>`:''}${x.url?'<div class="hint">外部網址需連線才能開啟</div>':''}</article>`;h+=`<div class="section"><h2>已存文件</h2><button class="secondary" data-go="documents">查看文件</button></div>`;if(!docs.length)h+='<div class="empty">沒有已存文件。請先在文件管理中新增。</div>';else h+=`<div class="card">${docs.map(d=>`<div class="dashboard-line">📁 ${safe(d.title)}${d.filedata?' · 有附件':' · 無附件'}</div>`).join('')}</div>`;h+=`<div class="safewarn">重要：此處沒有自動顯示醫院、警察、使館或緊急電話，因為各國資訊不同且可能變動。請出發前向官方來源查證，再將重要聯絡資訊填入行程或文件備註。無加密保護，避免儲存敏感證件。</div><div class="card"><b>離線準備提醒</b><p class="sub">先連網開啟部署在 HTTPS 的 APP，再於離線狀態實際重新開啟並確認必要行程。外部地圖需另用地圖 APP 下載；JSON 備份也應另存。</p><div class="actions"><button class="secondary" data-action="export">匯出 JSON 備份</button><button class="secondary" data-go="checklist">開啟行前清單</button></div></div>`;return h}
function more(){let h=shell('更多','旅程管理與安全備份');h+=`<div class="section"><h2>行前與旅程管理</h2></div><div class="card"><div class="row between"><div><b>☑ 行前準備</b><div class="sub">證件、行李、提醒事項</div></div><button class="secondary" data-go="checklist">打開清單</button></div></div><div class="card"><div class="row between"><div><b>📁 旅行文件與憑證</b><div class="sub">離線預訂資訊、PDF 與圖片附件</div></div><button class="secondary" data-go="documents">管理文件</button></div></div><div class="card"><div class="row between"><div><b>📴 離線旅行資訊</b><div class="sub">速查已存預訂與文件、離線準備說明</div></div><button class="secondary" data-go="offline">開啟工具</button></div></div><div class="card"><h3>我的旅行收藏</h3><div class="actions"><button class="primary" data-action="newTrip">＋ 建立旅程</button><button class="secondary" data-action="switch">切換旅程</button>${trip()?'<button class="secondary" data-action="editTrip">旅程設定</button><button class="danger" data-action="deleteTrip">刪除這趟旅程</button>':''}</div></div><div class="section"><h2>資料安全</h2></div><div class="card"><h3>備份所有旅行資料</h3><p class="sub">匯出完整 JSON（包含壓縮照片）。匯入只新增複本，不覆蓋原本旅程。</p><div class="actions"><button class="secondary" data-action="export">⬇ 匯出備份</button><button class="secondary" data-action="import">⬆ 匯入為複本</button></div><p class="caption">資料只存本機；清除瀏覽器網站資料、改用其他裝置或無痕模式可能造成資料無法存取，請定期備份。</p></div><div class="safewarn">這是獨立的《世界旅記》V2.3 測試版。沒有讀取或修改《越南冒險日記》及其他專案資料。沒有雲端同步、即時天氣或自動地圖。</div>`;return h}

function formatDay(d){if(!d)return '未指定日期';const z=new Date(d+'T12:00:00');return Number.isNaN(z.getTime())?d:z.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'})}
const niceUrl=u=>typeof u==='string'&&/^https:\/\/[^\s]+$/i.test(u)?u:'';
const explainEmpty=(emoji,title,desc,action,label)=>`<div class="empty"><div class="emoji">${emoji}</div><h3>${title}</h3><p class="sub">${desc}</p><button class="primary" data-add="${action}">＋ ${label}</button></div>`;
function plansView(){const t=trip();let h=shell('旅行行程','每天該去哪、住哪、怎麼移動，一目了然');if(!t)return h+`<div class="empty">先建立旅程<br><button class="primary" data-action="newTrip">建立旅程</button></div>`;h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-add="plans">＋ 新增行程</button></div>`;if(!t.plans.length)return h+explainEmpty('🗺','還沒有安排路線','加入景點、交通、住宿與預訂資訊','plans','新增第一個行程');const reservations=t.plans.filter(x=>['住宿','交通','活動'].includes(x.kind));if(reservations.length){const counts=['住宿','交通','活動'].map(k=>`${k} ${reservations.filter(x=>x.kind===k).length}`);h+=`<div class="card"><div class="row between"><b>🧾 預訂資訊總覽</b><span class="pill">${reservations.length} 筆</span></div><p class="sub">${counts.join(' · ')} · 點選下方行程可編輯預訂資訊</p><div class="summary-mini">${reservations.filter(x=>x.bookingStatus).map(x=>`<span class="pill">${safe(x.title)}：${safe(x.bookingStatus)}</span>`).join('')}</div></div>`}const days=[...new Set(t.plans.map(x=>x.date))].sort();h+=`<div class="chipbar"><button class="active" data-day="all">全部</button>${days.map(d=>`<button data-day="${safe(d)}">${safe(formatDay(d))}</button>`).join('')}</div><div id="planResults">`;for(const d of days){h+=`<section class="plan-day" data-date="${safe(d)}"><div class="day-group">🗓 ${safe(formatDay(d))}</div><div class="timeline">`;for(const x of t.plans.filter(x=>x.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''))){h+=`<article class="card"><div class="row between"><span class="tag">${safe(x.time||'彈性時間')}</span><span class="small">${safe(x.kind||'行程')}</span></div><h3 style="margin:9px 0 4px">${safe(x.title)}</h3>${x.place?`<div class="small">📍 ${safe(x.place)}</div>`:''}${x.ref?`<div class="small">🎟 ${safe(x.ref)}</div>`:''}${x.provider?`<div class="small">🏢 業者：${safe(x.provider)}</div>`:''}${x.bookingStatus?`<div class="small">🧾 預訂狀態：${safe(x.bookingStatus)}</div>`:''}${x.startAt?`<div class="small">🕐 開始 / 入住：${safe(x.startAt.replace('T',' '))}</div>`:''}${x.endAt?`<div class="small">🏁 結束 / 退房：${safe(x.endAt.replace('T',' '))}</div>`:''}${x.contact?`<div class="small">☎ 聯絡方式：${safe(x.contact)}</div>`:''}${x.detail?`<p class="note-text">${safe(x.detail)}</p>`:''}${niceUrl(x.url)?`<a class="plain-link" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">開啟相關連結 ↗</a>`:''}<div class="actions entry-actions"><button class="textbtn" data-edit="plans:${safe(x.id)}">編輯</button><button class="textbtn" style="color:var(--red)" data-delete="plans:${safe(x.id)}">刪除</button></div></article>`}h+='</div></section>'}return h+'</div>'}
function dailySpending(t){if(!t.expenses.length)return '';const days={};for(const x of t.expenses){if(/^\d{4}-\d{2}-\d{2}$/.test(x.date))days[x.date]=(days[x.date]||0)+cents(x.amount)}const entries=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0]));if(!entries.length)return '';const max=Math.max(...entries.map(x=>x[1]),1);return `<div class="section"><h2>每日花費 · Daily spending</h2></div><div class="card"><div class="daily-bars" role="img" aria-label="每日花費長條圖">${entries.map(([d,v])=>`<div class="daily-bar"><b>${formatCents(v)}</b><div class="bar-area"><div class="bar-fill" style="height:${Math.max(4,Math.round(v/max*94))}px" title="${safe(d)}：${formatCents(v)}"></div></div><span>${safe(d.slice(5))}</span></div>`).join('')}</div><div class="hint">${safe(currencyLabel(t.currency))} · 依記帳日期排列，橫向滑動可看更多日期。</div></div>`}
function splitSummary(t){const n=t.expenses.filter(x=>x.split?.people?.length).length;let h=`<div class="section"><h2>多人分帳 · Split expenses</h2><button class="secondary" data-action="editTrip">設定旅伴</button></div><div class="card"><p class="sub">已分攤 ${n} 筆；未設定分攤的舊支出不納入欠款計算。</p>`;if(!n)return h+'<div class="hint">新增支出時，可勾選「平均分帳」並選擇參與者。</div></div>';const balancesNow=balances(t),payments=settlements(t);h+='<h3>個人淨額</h3>';for(const [name,value] of Object.entries(balancesNow).sort((a,b)=>a[0].localeCompare(b[0])))h+=`<div class="split-row"><span>${safe(name)}</span><b>${value>0?'應收':value<0?'應付':'結清'} ${formatCents(Math.abs(value))}</b></div>`;h+='<h3 style="margin-top:15px">建議結算</h3>';h+=payments.length?payments.map(x=>`<div class="split-row"><span>${safe(x.from)} → ${safe(x.to)}</span><b>${formatCents(x.cents)}</b></div>`).join(''):'<p class="hint">已經結清，不需要轉帳。</p>';return h+'</div>'}
function expensesView(){const t=trip();let h=shell('旅費記帳','旅行預算、每日統計與多人分帳');if(!t)return h+`<div class="empty">先建立旅程<br><button class="primary" data-action="newTrip">建立旅程</button></div>`;const total=t.expenses.reduce((a,b)=>a+b.amount,0),count=t.expenses.length,by={},budget=Number(t.budget)||0;t.expenses.forEach(x=>by[x.category||'其他']=(by[x.category||'其他']||0)+x.amount);h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-add="expenses">＋ 記一筆</button></div><div class="overview"><div class="stat"><div class="small">總花費 · ${safe(currencyLabel(t.currency))}</div><b>${money(total)}</b></div><div class="stat"><div class="small">記帳筆數</div><b>${count}</b></div></div><div class="card"><div class="row between"><h3>旅行預算 Budget</h3><button class="secondary" data-action="editTrip">${budget?'調整預算':'設定預算'}</button></div>${budget?`<div class="small">總預算 · ${safe(currencyLabel(t.currency))}</div><h2>${money(budget)}</h2><div class="row between"><span>已使用 ${money(total)}（${money(total/budget*100)}%）</span><b style="color:${total>budget?'var(--red)':'var(--teal)'}">${total>budget?'超支':'剩餘'} ${money(Math.abs(budget-total))}</b></div><div class="budgetbar" role="progressbar" aria-label="預算使用進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(total/budget*100))}"><div style="width:${Math.min(100,total/budget*100)}%;background:${total>budget?'var(--red)':'var(--teal)'}"></div></div>`:`<p class="sub">尚未設定預算。設定後可以看到剩餘金額與超支提醒。</p>`}</div>`;h+=dailySpending(t)+splitSummary(t);if(!count)return h+explainEmpty('💳','第一筆旅行開銷','依餐飲、交通、住宿等類別自動統計','expenses','新增支出');h+=`<div class="section"><h2>分類統計</h2></div><div class="card">`;for(const [cat,value] of Object.entries(by).sort((a,b)=>b[1]-a[1]))h+=`<div class="row between"><b>${safe(expenseCategoryLabel(cat))}</b><b>${safe(currencyLabel(t.currency))} ${money(value)}</b></div><div class="budgetbar" style="margin:5px 0 13px"><div style="width:${total?Math.min(100,value/total*100):0}%"></div></div>`;h+='</div><div class="section"><h2>支出明細</h2></div>';const cats=[...new Set(t.expenses.map(x=>x.category||'其他'))].sort();if(!cats.includes(expenseFilter))expenseFilter='all';h+=`<div class="field"><label for="expenseFilter">依分類篩選 Filter by category</label><select id="expenseFilter"><option value="all">全部分類 · All Categories</option>${cats.map(c=>`<option value="${safe(c)}" ${expenseFilter===c?'selected':''}>${safe(expenseCategoryLabel(c))}</option>`).join('')}</select></div>`;let filtered=t.expenses.filter(x=>expenseFilter==='all'||(x.category||'其他')===expenseFilter),subtotal=filtered.reduce((a,b)=>a+b.amount,0);h+=`<div class="small" style="margin:10px 0">顯示 ${filtered.length} 筆 · 小計 ${safe(currencyLabel(t.currency))} ${money(subtotal)}</div>`;for(const x of [...filtered].sort((a,b)=>b.date.localeCompare(a.date))){h+=`<div class="card"><div class="row between"><div><span class="tag">${safe(expenseCategoryLabel(x.category))}</span><span class="small" style="margin-left:8px">${safe(x.date||'未指定日期')}</span></div><b class="accent">${safe(currencyLabel(t.currency))} ${money(x.amount)}</b></div><h3 style="margin:10px 0 3px">${safe(x.title)}</h3>${x.payer?`<span class="small">付款人：${safe(x.payer)}</span>`:''}${x.split?.people?.length?`<div class="small">平均分攤：${x.split.people.map(safe).join('、')}（每人約 ${money(x.amount/x.split.people.length)}）</div>`:''}${x.detail?`<p>${safe(x.detail)}</p>`:''}<div class="actions entry-actions"><button class="textbtn" data-edit="expenses:${safe(x.id)}">編輯</button><button class="textbtn" style="color:var(--red)" data-delete="expenses:${safe(x.id)}">刪除</button></div></div>`}return h}

function memoriesView(){const t=trip();let h=shell('旅途回憶','把當天的心情、照片和故事留下來');if(!t)return h+`<div class="empty">先建立旅程<br><button class="primary" data-action="newTrip">建立旅程</button></div>`;h+=`<div class="section"><h2>${safe(t.name)}</h2><button class="primary" data-add="notes">＋ 新增回憶</button></div>`;if(!t.notes.length)return h+explainEmpty('📷','用文字和照片收藏每一天','可附照片、心情與回憶地點，並能編輯或刪除','notes','寫第一篇回憶');const images=t.notes.filter(x=>x.photo);const places=[...new Set(t.notes.map(x=>x.place).filter(Boolean))];h+=`<div class="summary-mini"><span class="pill">✍️ ${t.notes.length} 篇回憶</span><span class="pill">📷 ${images.length} 張照片</span><span class="pill">📍 ${places.length} 個足跡</span></div>`;if(places.length)h+=`<div class="card"><b>📍 旅途足跡</b><div class="summary-mini">${places.map(x=>`<span class="tag">${safe(x)}</span>`).join('')}</div></div>`;if(images.length)h+=`<div class="section"><h2>回憶相簿</h2></div><div class="photo-grid">${images.map(x=>`<img loading="lazy" alt="${safe(x.title)}" src="${safe(x.photo)}">`).join('')}</div>`;h+=`<div class="section"><h2>旅行故事</h2><button class="secondary" data-action="memoryBook">閱讀回憶錄</button></div>`;for(const x of [...t.notes].sort((a,b)=>b.date.localeCompare(a.date))){h+=`<article class="card memory-card"><div class="row between"><span class="tag">${safe(formatDay(x.date))}</span><span class="small">${safe(x.mood||'📝 日常')}</span></div><h3 style="margin:10px 0 3px">${safe(x.title)}</h3>${x.place?`<div class="small">📍 ${safe(x.place)}</div>`:''}${x.photo?`<img loading="lazy" class="photo" src="${safe(x.photo)}" alt="${safe(x.title)}">`:''}${x.detail?`<p class="note-text">${safe(x.detail)}</p>`:''}<div class="actions entry-actions"><button class="textbtn" data-edit="notes:${safe(x.id)}">編輯</button><button class="textbtn" style="color:var(--red)" data-delete="notes:${safe(x.id)}">刪除</button></div></article>`}return h}
function memoryBook(){const t=trip();if(!t)return;const items=[...t.notes].sort((a,b)=>a.date.localeCompare(b.date));if(!items.length){notify('尚無回憶可以閱讀');return}openModal(`<h2>📖 ${safe(t.name)} · 旅行回憶錄</h2><p class="sub">${safe(dates(t))} · ${safe(t.country||'自由目的地')}</p><hr class="muted-divider">${items.map(x=>`<article style="margin:22px 0"><span class="small">${safe(formatDay(x.date))} · ${safe(x.mood||'')}</span><h3>${safe(x.title)}</h3>${x.place?`<div class="small">📍 ${safe(x.place)}</div>`:''}${x.photo?`<img class="photo" src="${safe(x.photo)}" alt="${safe(x.title)}">`:''}<p style="white-space:pre-wrap;overflow-wrap:anywhere">${safe(x.detail)}</p></article>`).join('<hr class="muted-divider">')}<div class="actions"><button class="secondary" data-action="close">關閉</button></div>`)}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('格式');if(file.size>18*1024*1024)throw Error('過大');let bitmap;try{bitmap=await createImageBitmap(file)}catch(e){bitmap=await new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(e)};img.src=url})}const dim=Math.min(1,750/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*dim));canvas.height=Math.max(1,Math.round(bitmap.height*dim));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();let result=canvas.toDataURL('image/jpeg',.64);if(result.length>350000)result=canvas.toDataURL('image/jpeg',.4);if(result.length>350000)throw Error('照片壓縮後仍太大');return result}

function openModal(html){$('#dialog').innerHTML=html;$('#modal').classList.add('open');$('#dialog').querySelector('input,select,textarea,button')?.focus()}
function closeModal(){$('#modal').classList.remove('open');$('#dialog').innerHTML='';modalMode=''}
function tripForm(t){modalMode='trip';const edit=!!t;openModal(`<form id="tripForm"><h2>${edit?'編輯旅程':'建立全新旅程'}</h2><p class="sub">每趟旅程都有自己的獨立紀錄。</p><div class="field"><label for="t-name">旅行名稱 *</label><input id="t-name" name="name" required maxlength="100" value="${safe(t?.name||'')}" placeholder="例如：春日京都五日遊"></div><div class="field"><label for="t-country">目的地</label><input id="t-country" name="country" maxlength="100" value="${safe(t?.country||'')}" placeholder="國家、城市或區域"></div><div class="grid"><div class="field"><label for="t-start">開始日期</label><input id="t-start" name="start" type="date" value="${safe(t?.start||'')}"></div><div class="field"><label for="t-end">結束日期</label><input id="t-end" name="end" type="date" value="${safe(t?.end||'')}"></div></div><div class="field"><label for="t-currency">記帳幣別（中文 / English）</label><select id="t-currency" name="currency">${['TWD','JPY','KRW','VND','USD','EUR','CNY','THB','HKD','SGD','GBP','AUD','OTHER'].map(c=>`<option value="${c}" ${c===(t?.currency||'TWD')?'selected':''}>${safe(currencyLabel(c))}</option>`).join('')}</select></div><div class="field"><label for="t-budget">整趟旅行預算（${safe(currencyLabel(t?.currency||'TWD'))}，選填）</label><input id="t-budget" name="budget" type="number" min="0" max="1000000000000" step="0.01" value="${t?.budget||''}" placeholder="例如：50000"><div class="hint">0 或留空代表尚未設定預算。預算與支出均使用這趟旅程的記帳幣別。</div></div><div class="field"><label for="t-members">旅伴姓名（選填，逗號分隔）</label><textarea id="t-members" name="members" maxlength="2500" placeholder="例如：小明、小美、阿華">${safe(membersFor(t||{}).join('、'))}</textarea><div class="hint">可隨時新增旅伴；舊帳目不會被自動分攤。</div></div><div class="actions"><button type="submit" class="primary">${edit?'儲存修改':'建立旅程'}</button><button type="button" data-action="close" class="secondary">取消</button></div></form>`);$('#tripForm').dataset.id=t?.id||''}
function entryForm(type,id){const t=trip();if(!t)return;const x=t[type].find(q=>q.id===id);modalMode='entry';const title=labels[type][2],d=safe(x?.date||today());const itinerary=type==='plans'?`<div class="field-row"><div class="field"><label for="e-time">時間</label><input id="e-time" name="time" type="time" value="${safe(x?.time||'')}"></div><div class="field"><label for="e-kind">類型</label><select id="e-kind" name="kind">${['景點','美食','交通','住宿','活動','其他'].map(k=>`<option ${x?.kind===k?'selected':''}>${k}</option>`).join('')}</select></div></div><div class="note">住宿、交通及活動可填寫業者、預訂狀態、入住／出發時間等資訊。其他行程也可留空。</div><div class="field-row"><div class="field"><label for="e-provider">業者 / 飯店 / 航空公司</label><input id="e-provider" name="provider" maxlength="160" value="${safe(x?.provider||'')}" placeholder="例如：飯店或運輸公司"></div><div class="field"><label for="e-status">預訂狀態</label><select id="e-status" name="bookingStatus">${['','待預訂','已預訂','已付款','部分付款','已取消'].map(k=>`<option value="${safe(k)}" ${x?.bookingStatus===k?'selected':''}>${safe(k||'不設定')}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label for="e-start-at">出發 / 入住日期時間</label><input id="e-start-at" type="datetime-local" name="startAt" value="${safe(x?.startAt||'')}"></div><div class="field"><label for="e-end-at">抵達 / 退房日期時間</label><input id="e-end-at" type="datetime-local" name="endAt" value="${safe(x?.endAt||'')}"></div></div><div class="field"><label for="e-contact">聯絡方式 / 電話</label><input id="e-contact" name="contact" maxlength="160" value="${safe(x?.contact||'')}" placeholder="例如：飯店電話或客服方式"></div><div class="field"><label for="e-place">地點 / 地址</label><input id="e-place" name="place" maxlength="250" value="${safe(x?.place||'')}" placeholder="可貼地址或地點名稱"></div><div class="field"><label for="e-ref">預訂編號 / 交通班次</label><input id="e-ref" name="ref" maxlength="180" value="${safe(x?.ref||'')}"></div><div class="field"><label for="e-url">地圖 / 官網 / 憑證連結（https）</label><input id="e-url" name="url" type="url" maxlength="1000" value="${safe(x?.url||'')}" placeholder="https://..."></div>`:'';const expenses=type==='expenses'?`<div class="field-row"><div class="field"><label for="e-amount">金額 · ${safe(currencyLabel(t.currency))} *</label><input id="e-amount" name="amount" type="number" min="0" max="1000000000000" step="0.01" value="${x?x.amount:''}" required></div><div class="field"><label for="e-cat">花費分類</label><select name="category" id="e-cat">${Object.keys(EXPENSE_CATEGORIES).map(k=>`<option value="${safe(k)}" ${x?.category===k?'selected':''}>${safe(expenseCategoryLabel(k))}</option>`).join('')}</select></div></div><div class="field"><label for="e-payer">付款人</label><input id="e-payer" name="payer" list="payerNames" maxlength="80" value="${safe(x?.payer||'')}" placeholder="輸入姓名或選擇旅伴"><datalist id="payerNames">${membersFor(t).map(m=>`<option value="${safe(m)}"></option>`).join('')}</datalist></div><div class="field"><label class="check"><input type="checkbox" id="splitEnabled" ${x?.split?.people?.length?'checked':''}>平均分帳 · Split equally</label><div class="hint">勾選後，先確認付款人，再選參與這筆費用的人。</div><div class="member-checks" id="splitMembers" ${x?.split?.people?.length?'':'hidden'}>${[...new Set([...membersFor(t),...(x?.split?.people||[])])].map(m=>`<label><input type="checkbox" name="splitPerson" value="${safe(m)}" ${x?.split?.people?.includes(m)||(!x&&false)?'checked':''}> ${safe(m)}</label>`).join('')}</div>${membersFor(t).length===0?'<div class="hint">請先到「編輯旅程」設定旅伴姓名，才可分帳。</div>':''}</div>`:'';const memories=type==='notes'?`<div class="field-row"><div class="field"><label for="e-mood">今天心情</label><select name="mood" id="e-mood">${['😊 開心','🤩 驚喜','😌 放鬆','🥹 感動','😮 冒險','📝 日常'].map(k=>`<option ${x?.mood===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="e-memory-place">回憶地點</label><input name="place" id="e-memory-place" maxlength="250" value="${safe(x?.place||'')}"></div></div><div class="field"><label for="photoFile">回憶照片（每篇 1 張，會自動壓縮）</label><input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp,image/*"><div class="hint">照片只存在本機備份中，建議保留原始照片。每張壓至約 750px。</div></div>${x?.photo?`<div class="card"><img class="photo" src="${safe(x.photo)}" alt="已存照片"><label class="check"><input id="removePhoto" type="checkbox">移除此篇照片</label></div>`:''}`:'';openModal(`<form id="entryForm" data-type="${type}" data-id="${safe(x?.id||'')}"><h2>${x?'編輯':'新增'}${title}</h2><div class="field"><label for="e-title">${type==='tasks'?'待辦事項':'標題'} *</label><input id="e-title" name="title" required maxlength="160" value="${safe(x?.title||'')}"></div><div class="field"><label for="e-date">日期</label><input id="e-date" type="date" name="date" value="${d}"></div>${itinerary}${expenses}${memories}<div class="field"><label for="e-detail">${type==='notes'?'當天的故事、感受':'備註 / 詳細資訊'}</label><textarea name="detail" id="e-detail" maxlength="10000">${safe(x?.detail||'')}</textarea></div><div class="actions"><button class="primary" type="submit">儲存</button><button class="secondary" type="button" data-action="close">取消</button></div></form>`)}
function switchDialog(){modalMode='switch';openModal(`<h2>我的旅行收藏</h2><p class="sub">點擊旅程即可切換，所有紀錄分開儲存。</p>${state.trips.length?state.trips.map(tripCard).join(''):'<div class="empty">目前沒有旅程</div>'}<div class="actions"><button class="primary" data-action="newTrip">＋ 建立旅程</button><button class="secondary" data-action="close">關閉</button></div>`)}
function saveTrip(f){const v=Object.fromEntries(new FormData(f));if(!v.name.trim()){notify('請填寫旅行名稱');return}if(v.budget.trim()&&(!Number.isFinite(Number(v.budget))||Number(v.budget)<0||Number(v.budget)>1e12)){notify('預算需為 0 至 1 兆之間的金額');return}const members=uniqueMembers(v.members);if(members.length>30||members.some(m=>m.length>80)){notify('最多 30 位旅伴，每人姓名不超過 80 字');return}if(v.start&&v.end&&v.end<v.start){notify('結束日期不能早於開始日期');return}let n=copy(),id=f.dataset.id;if(id){const t=n.trips.find(t=>t.id===id);if(!t)return;Object.assign(t,{name:v.name.trim(),country:v.country.trim(),start:v.start,end:v.end,currency:v.currency,budget:v.budget.trim()?Math.round(Number(v.budget)*100)/100:0,members})}else{const t={id:uid(),name:v.name.trim(),country:v.country.trim(),start:v.start,end:v.end,currency:v.currency,budget:v.budget.trim()?Math.round(Number(v.budget)*100)/100:0,members,plans:[],expenses:[],notes:[],tasks:[],documents:[]};n.trips.push(t);n.active=t.id}if(persist(n)){closeModal();go('home');notify('旅程已儲存')}}
async function saveEntry(f){const type=f.dataset.type,id=f.dataset.id,v=Object.fromEntries(new FormData(f));const n=copy(),t=n.trips.find(x=>x.id===n.active);if(!t||!TYPES.includes(type))return;const title=v.title.trim();if(!title){notify('請填寫標題');return}const amount=Number(v.amount);if(type==='expenses'&&(!v.amount.trim()||!Number.isFinite(amount)||amount<0||amount>1e12)){notify('金額不正確');return}if(type==='expenses'&&f.querySelector('#splitEnabled')?.checked){const participants=[...f.querySelectorAll('input[name=splitPerson]:checked')].map(e=>e.value);if(!participants.length){notify('請至少選擇一位分攤者');return}if(!v.payer?.trim()){notify('請填寫付款人');return}if(participants.length>30){notify('分攤人數過多');return}}if(type==='plans'&&v.url&&(!/^https:\/\/[^\s]+$/i.test(v.url)||v.url.length>1000)){notify('請使用 https:// 開頭的連結');return}if(type==='plans'&&v.startAt&&v.endAt&&v.endAt<v.startAt){notify('結束／退房時間不能早於開始／入住時間');return}const old=t[type].find(x=>x.id===id),entry={id:old?.id||uid(),title,date:v.date||'',detail:v.detail||''};if(type==='expenses'){entry.amount=Math.round(amount*100)/100;entry.category=v.category;entry.payer=v.payer?.trim()||'';if(f.querySelector('#splitEnabled')?.checked){entry.split={people:[...f.querySelectorAll('input[name=splitPerson]:checked')].map(e=>e.value)}}}if(type==='plans'){entry.time=v.time||'';entry.kind=v.kind||'其他';entry.place=v.place||'';entry.ref=v.ref||'';entry.url=v.url||'';entry.provider=v.provider||'';entry.bookingStatus=v.bookingStatus||'';entry.startAt=v.startAt||'';entry.endAt=v.endAt||'';entry.contact=v.contact||''}if(type==='notes'){entry.mood=v.mood||'😊 開心';entry.place=v.place||'';entry.photo=old?.photo||'';if(f.querySelector('#removePhoto')?.checked)entry.photo='';const file=f.querySelector('#photoFile')?.files[0];if(file){try{entry.photo=await compressPhoto(file)}catch(e){notify('照片無法讀取或格式不支援，未儲存任何修改');return}}}if(type==='tasks')entry.done=old?.done||false;if(old){Object.assign(old,entry);if(type==='expenses'&&!entry.split)delete old.split}else t[type].push(entry);if(persist(n)){closeModal();render();notify('已儲存')}else notify('儲存失敗，請先匯出備份或刪除不需要的照片')}
function removeEntry(type,id){if(!TYPES.includes(type))return;const t=trip(),item=t?.[type].find(x=>x.id===id);if(!item||!confirm(`確定刪除「${item.title}」？此動作無法復原。`))return;let n=copy();n.trips.find(x=>x.id===n.active)[type]=n.trips.find(x=>x.id===n.active)[type].filter(x=>x.id!==id);if(persist(n)){render();notify('已刪除')}}
function deleteTrip(){const t=trip();if(!t||!confirm(`確定永久刪除「${t.name}」及其中所有紀錄？請先匯出備份。`))return;let n=copy();n.trips=n.trips.filter(x=>x.id!==t.id);n.active=n.trips[0]?.id||null;if(persist(n)){go('home');notify('旅程已刪除')}}
function exportBackup(){const content=JSON.stringify({format:'world-travel-notebook-v1',exportedAt:new Date().toISOString(),data:state},null,2);const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='世界旅記_完整備份_'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('已要求下載完整備份，請確認下載資料夾中有 JSON 檔案')}
async function importBackup(file){if(!file)return;if(file.size>MAX_IMPORT_BYTES){notify('檔案太大（限制 15 MB）');return}let data;try{const raw=JSON.parse(await file.text());if(raw?.format!=='world-travel-notebook-v1'||!validData(raw.data))throw Error('不支援的備份格式');data=raw.data}catch(e){notify('匯入失敗：檔案格式不正確');return}if(!data.trips.length){notify('備份內沒有旅程');return}if(!confirm(`將備份內 ${data.trips.length} 趟旅程新增為複本，不會覆蓋現有資料。確定匯入？`))return;const n=copy();const used=new Set(n.trips.map(x=>x.id));for(const src of data.trips){const t=JSON.parse(JSON.stringify(src));t.id=uid();while(used.has(t.id))t.id=uid();used.add(t.id);t.name+='（匯入）';for(const type of TYPES){t[type]=t[type].map(e=>({...e,id:uid()}))}if(t.documents)t.documents=t.documents.map(d=>({...d,id:uid()}));n.trips.push(t)}if(n.trips.length>300){notify('旅行數量超過上限，匯入取消');return}if(!n.active)n.active=n.trips[0].id;if(persist(n)){closeModal();go('home');notify(`成功新增 ${data.trips.length} 趟旅程`)}}
// 事件委派，不建立無用途的裝飾性按鈕。
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.template){addTaskTemplate(target.dataset.template);return}if(target.dataset.docedit){documentForm(target.dataset.docedit);return}if(target.dataset.docdelete){deleteDocument(target.dataset.docdelete);return}if(target.dataset.docdownload){downloadDocument(target.dataset.docdownload);return}if(target.dataset.go){closeModal();go(target.dataset.go);return}if(target.dataset.day){document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===target));document.querySelectorAll('.plan-day').forEach(x=>x.style.display=target.dataset.day==='all'||x.dataset.date===target.dataset.day?'':'none');return}if(target.dataset.activate){let n=copy();if(!n.trips.some(t=>t.id===target.dataset.activate))return;n.active=target.dataset.activate;if(persist(n)){closeModal();go('home');notify('已切換旅程')}return}if(target.dataset.add){entryForm(target.dataset.add);return}if(target.dataset.edit){const [t,id]=target.dataset.edit.split(':');entryForm(t,id);return}if(target.dataset.delete){const [t,id]=target.dataset.delete.split(':');removeEntry(t,id);return}switch(target.dataset.action){case'addDocument':documentForm();break;case'newTrip':tripForm();break;case'editTrip':tripForm(trip());break;case'switch':switchDialog();break;case'close':closeModal();break;case'deleteTrip':deleteTrip();break;case'memoryBook':memoryBook();break;case'export':exportBackup();break;case'import':$('#importFile').click();break}});
document.addEventListener('submit',e=>{if(e.target.id==='tripForm'){e.preventDefault();saveTrip(e.target)}else if(e.target.id==='entryForm'){e.preventDefault();saveEntry(e.target)}else if(e.target.id==='documentForm'){e.preventDefault();saveDocument(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='splitEnabled'){const b=document.querySelector('#splitMembers');if(b)b.hidden=!e.target.checked;return}if(e.target.id==='expenseFilter'){expenseFilter=e.target.value;render();return}if(e.target.dataset.check){const n=copy(),t=n.trips.find(x=>x.id===n.active),x=t?.tasks.find(x=>x.id===e.target.dataset.check);if(x){x.done=e.target.checked;if(persist(n))render()}}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';await importBackup(file)});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>

    navigator.serviceWorker.register('./service-worker.js', {scope:'./'}).catch(err => console.warn('離線安裝註冊失敗', err));
